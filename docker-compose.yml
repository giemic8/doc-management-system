services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dms_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dms_db}
      POSTGRES_USER: ${POSTGRES_USER:-dms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dms_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms_user} -d ${POSTGRES_DB:-dms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_DB: dms_db_test
      POSTGRES_USER: dms_user
      POSTGRES_PASSWORD: dms_secret_password
    ports:
      - "${DMS_TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms_user -d dms_db_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    ports:
      - "${DMS_TEST_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-dms_user}:${POSTGRES_PASSWORD:-dms_secret_password}@postgres:5432/${POSTGRES_DB:-dms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_prod}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-change_this_mfa_encryption_key_in_prod}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-change_this_storage_encryption_key_in_prod}
      STORAGE_ENCRYPTION_ENABLED: ${STORAGE_ENCRYPTION_ENABLED:-false}
      STORAGE_PATH: /app/storage
      # Ticket #31 — second independent copy of every durable original.
      # Must be a distinct host mount from STORAGE_PATH (different disk),
      # or the dual-copy write buys no real redundancy against disk failure.
      STORAGE_REPLICA_PATH: /app/storage-replica
      # Ticket #37 — outbound SMTP for operations alerts. Empty SMTP_HOST
      # keeps the channel switched off; incidents are still recorded and
      # shown in the operations dashboard as undelivered.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BACKUP_ALERT_EMAIL_FROM: ${BACKUP_ALERT_EMAIL_FROM:-}
    volumes:
      - ./storage:/app/storage
      - ${STORAGE_REPLICA_HOST_PATH:-./storage-replica}:/app/storage-replica
      - backup_status:/app/backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    # No container_name: fixed names collide when scaling to N replicas via
    # `docker compose up -d --scale worker=4`.
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dms_user}:${POSTGRES_PASSWORD:-dms_secret_password}@postgres:5432/${POSTGRES_DB:-dms_db}
      STORAGE_PATH: /app/storage
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-change_this_storage_encryption_key_in_prod}
      METRICS_PORT: 9100
    volumes:
      - ./storage:/app/storage
    # Uncomment to enable NVIDIA GPU acceleration for Tesseract/Ollama
    # (requires the NVIDIA Container Toolkit installed on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dms_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: dms_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Ticket #17 — Offsite Backup & Automated Disaster Recovery.
  # Standalone container (like `worker`) since pg_dump/gpg/rclone are
  # external CLI tools, not npm packages. Runs a daily sleep-loop (see
  # backup/entrypoint.sh) that dumps the DB + document storage, encrypts
  # both with GPG AES-256, and syncs them offsite via rclone. Writes
  # last-backup-status.json into the shared `backup_status` volume, which
  # the `backend` service mounts read-only so GET /api/backup/status can
  # report backup health on the admin dashboard.
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: dms_backup
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dms_user}:${POSTGRES_PASSWORD:-dms_secret_password}@postgres:5432/${POSTGRES_DB:-dms_db}
      STORAGE_PATH: /app/storage
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-change_this_backup_encryption_key_in_prod}
      BACKUP_REPLICA_DIR: /backups-replica
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      REQUIRE_OFFSITE_BACKUP: ${REQUIRE_OFFSITE_BACKUP:-false}
      RESTORE_DATABASE_NAME: dms_restore_verify
      RESTORE_DATABASE_URL: postgres://${POSTGRES_USER:-dms_user}:${POSTGRES_PASSWORD:-dms_secret_password}@postgres:5432/dms_restore_verify
      RESTORE_VERIFY_INTERVAL_SECONDS: ${RESTORE_VERIFY_INTERVAL_SECONDS:-604800}
      RESTORE_SAMPLE_SIZE: ${RESTORE_SAMPLE_SIZE:-25}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BACKUP_ALERT_EMAIL_TO: ${BACKUP_ALERT_EMAIL_TO:-}
      BACKUP_ALERT_EMAIL_FROM: ${BACKUP_ALERT_EMAIL_FROM:-}
      # Leave RCLONE_REMOTE empty to run backups locally without an offsite
      # upload (e.g. local dev) — see backup/scripts/run-backup.sh.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - ./storage:/app/storage:ro
      - backup_status:/backups
      # Must point at another physical disk/mount in production.
      - ${BACKUP_REPLICA_HOST_PATH:-./backup-replica}:/backups-replica
      # Default example keeps local setup bootable. Production points this
      # variable at gitignored backup/rclone.conf containing credentials.
      - ${RCLONE_CONFIG_HOST_PATH:-./backup/rclone.conf.example}:/config/rclone/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  backup_status:
